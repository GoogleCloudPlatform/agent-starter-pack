[project]
name = "agent-starter-pack"
version = "1.0.0"
description = "Agent Starter Pack is now Agents CLI (google-agents-cli)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["google-agents-cli"]

[project.urls]
Homepage = "https://github.com/google/agents-cli"

[project.scripts]
agent-starter-pack = "google.agents.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No module of its own: the script runs the agents-cli root command.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md", "LICENSE"]
